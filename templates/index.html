<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-commerce Chatbot</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="chat-container">
<div class="header"><div class="icon">🛒</div><h1>E-commerce Chatbot</h1><p>Your online shopping assistant</p></div>
<div id="chat-box" class="chat-box">
<div class="message bot"><strong>Shopping Bot</strong><br>Hello! 👋 I can help with orders, delivery, returns, refunds, payments, discounts, coupons, and shopping safety.</div>
</div>
<form id="chat-form" class="input-area">
<input id="message" type="text" placeholder="Ask an e-commerce question..." autocomplete="off" required>
<button type="submit">Send</button>
</form>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
